<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>March 2026</title>
    <style>
        body {
            padding: 0;
            margin: 0;
        }
        .days{
            display: inline;
            border-radius: 10px;
            margin: 0;
            padding-block: 10px;
       
        }
        p{ 
            margin: 0px;
            padding: 15px;
        }
        
        .date, .day{
            display: inline-block;
            width: 102px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }
        .date{
             margin-top: 20px;
        }
        .text-gray{
            color: gray;
        }
        .text-red {
            color: red;
        }
        .text-red-fade {
            color: rgba(255, 0, 0, 0.411);
        }
        .green {
            background-color: greenyellow;
        }
        .row-1{
            margin-top: 10px;
        }

       
    </style>
</head>
<body>
    <section class="calendar">
        <div class="month">
            <!-- <div class="top">March 2026</div>
            <div class="top"></div>
            <div class="top"></div> -->
        </div>
        <div class="days green">
            <div class="day">Monday</div>
            <div class="day">Tuesday</div>
            <div class="day">Wednesday</div>
            <div class="day">Thursday</div>
            <div class="day">Friday</div>
            <div class="day">Saturday</div>
            <div class="day text-red">Sunday</div>
        </div>
        <div class="dates">
            <div class="row row-1">
                <div class="date text-gray"><p>25</p></div>
                <div class="date text-gray"><p>26</p></div>
                <div class="date text-gray"><p>27</p></div>
                <div class="date text-gray"><p>28</p></div>
                <div class="date text-gray"><p>29</p></div>
                <div class="date text-gray"><p>30</p></div>
                <div class="date text-red"><p>1</p></div>
            </div>
            <div class="row row-2">
                <div class="date"><p>2</p></div>
                <div class="date"><p>3</p></div>
                <div class="date"><p>4</p></div>
                <div class="date"><p>5</p></div>
                <div class="date"><p>6</p></div>
                <div class="date"><p>7</p></div>
                <div class="date text-red"><p>8</p></div>
            </div>
            <div class="row row-3">
                <div class="date"><p>9</p></div>
                <div class="date"><p>10</p></div>
                <div class="date"><p>11</p></div>
                <div class="date"><p>12</p></div>
                <div class="date"><p>13</p></div>
                <div class="date"><p>14</p></div>
                <div class="date text-red"><p>15</p></div>
            </div>
            <div class="row row-4">
                <div class="date"><p>16</p></div>
                <div class="date"><p>17</p></div>
                <div class="date"><p>18</p></div>
                <div class="date"><p>19</p></div>
                <div class="date"><p>20</p></div>
                <div class="date"><p>21</p></div>
                <div class="date text-red"><p>22</p></div>
            </div>
            <div class="row row-5">
                <div class="date"><p>23</p></div>
                <div class="date"><p>24</p></div>
                <div class="date"><p>25</p></div>
                <div class="date"><p>26</p></div>
                <div class="date"><p>27</p></div>
                <div class="date"><p>28</p></div>
                <div class="date text-red"><p>29</p></div>
            </div>
            <div class="row row-6">
                <div class="date"><p>30</p></div>
                <div class="date"><p>31</p></div>
                <div class="date text-gray"><p>1</p></div>
                <div class="date text-gray"><p>2</p></div>
                <div class="date text-gray"><p>3</p></div>
                <div class="date text-gray"><p>4</p></div>
                <div class="date text-red-fade"><p>5</p></div>
            </div>
        </div>
    </section>
</body>
</html>
